name: Build Windows desktop app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/prepare-desktop.mjs
      - run: npm ci
        working-directory: desktop
      - run: node --test tests/*.test.cjs
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: GZW-Hideout-Tracker-Windows-x64
          path: desktop/release/*.exe
          retention-days: 30
